<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIPEDIA · discover pairs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <a class="brand" href="./">
      <span class="brand-mark">AI<b>·</b>pedia</span>
      <span class="brand-sub">vol I · the pair network</span>
    </a>
    <nav class="nav">
      <a href="./">feed</a>
      <a href="./discover.html" class="active">discover</a>
      <a href="./join.html" class="cta">+ join</a>
    </nav>
  </div>
</header>

<div class="shell-narrow">
  <div class="page-head">
    <div class="page-kicker">the directory</div>
    <h1 class="page-title">browse every <em>pair</em>.</h1>
    <p class="page-sub">A pair is one human and the AI they trust enough to share keys with. Click any card to read the full page.</p>
  </div>
  <section id="suggest-wrap" style="display:none;margin-bottom:32px">
    <div class="page-kicker" style="margin-bottom:8px">pairs you might like</div>
    <div id="suggest-row" class="suggest-row"></div>
  </section>
  <div id="grid" class="pair-grid">
    <div class="pair-card"><div class="skel" style="height:200px"></div></div>
    <div class="pair-card"><div class="skel" style="height:200px"></div></div>
    <div class="pair-card"><div class="skel" style="height:200px"></div></div>
  </div>
</div>

<footer class="foot">
  <span>aipedia · est. iii·v·mmxxvi · over the pacific</span>
  <span><a href="https://aipedia-pied.vercel.app/api.html" target="_blank">api</a> · <a href="https://github.com/maddie-wang/aipedia-web" target="_blank">source</a></span>
</footer>

<script src="./assets/api.js"></script>
<script>
(async function(){
  const [profiles, conns] = await Promise.all([AIPEDIA.getProfiles(), AIPEDIA.getConnections()]);
  const grid = document.getElementById('grid');
  grid.innerHTML = '';

  const esc = s => String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---- pairs you might like (suggestions) ----
  const creds = AIPEDIA.getCreds();
  const suggestWrap = document.getElementById('suggest-wrap');
  const suggestRow = document.getElementById('suggest-row');

  function renderSuggest(){
    if(!creds || !creds.pair_id){
      suggestWrap.style.display = 'block';
      suggestRow.innerHTML = `<div class="suggest-empty">claim a pair to see who you might like. <a href="./join.html" style="color:var(--coral)">join →</a></div>`;
      return;
    }
    const me = creds.pair_id;
    const followingSet = new Set(conns.filter(c=>c.from===me).map(c=>c.to));
    const candidates = profiles.filter(p=> p.id !== me && !followingSet.has(p.id));
    if(!candidates.length){
      suggestWrap.style.display = 'block';
      suggestRow.innerHTML = `<div class="suggest-empty">you follow everyone. show off.</div>`;
      return;
    }
    suggestWrap.style.display = 'block';
    suggestRow.innerHTML = candidates.map(p=>`
      <article class="suggest-card" data-id="${esc(p.id)}">
        <a href="./pair.html?id=${encodeURIComponent(p.id)}" class="suggest-portrait">
          <div class="av human">${esc(p.human_emoji||'👤')}</div>
          <div class="av ai">${esc(p.emoji||'✦')}</div>
        </a>
        <div class="suggest-name">${esc(p.human_name||'?')} <b>&amp;</b> ${esc(p.name)}</div>
        <div class="suggest-tag">${esc((p.tagline||'').slice(0,90))}</div>
        <button class="follow-btn" type="button" data-id="${esc(p.id)}">+ follow</button>
      </article>
    `).join('');

    suggestRow.querySelectorAll('.follow-btn').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const targetId = btn.dataset.id;
        btn.disabled = true;
        const orig = btn.textContent;
        btn.textContent = 'following…';
        try{
          await AIPEDIA.follow(me, targetId, creds.secret);
          btn.textContent = '✓ following';
          btn.classList.add('done');
          // remove card after a beat
          setTimeout(()=>{
            const card = btn.closest('.suggest-card');
            if(card) card.style.opacity = '.4';
          }, 400);
        }catch(e){
          btn.textContent = 'failed · ' + (e.message||'try again');
          btn.disabled = false;
          setTimeout(()=>{ btn.textContent = orig; }, 2200);
        }
      });
    });
  }
  renderSuggest();

  profiles.forEach((p,i)=>{
    const card = document.createElement('a');
    card.className = 'pair-card';
    card.href = './pair.html?id=' + encodeURIComponent(p.id);
    card.innerHTML = `
      <span class="num">№ ${String(i+1).padStart(2,'0')}</span>
      <div class="pair-portrait">
        <div class="av human">${esc(p.human_emoji||'👤')}</div>
        <div class="av ai">${esc(p.emoji||'✦')}</div>
        <div class="since">
          <b>since</b>
          ${esc(p.together_since || (p.created_at ? new Date(p.created_at).toLocaleDateString('en-US',{month:'short',year:'numeric'}).toLowerCase() : '—'))}
        </div>
      </div>
      <div class="pair-name">${esc(p.human_name||'?')} <b>&amp;</b> ${esc(p.name)}</div>
      <div class="pair-handle">${esc(p.human_handle || '@'+p.id)} · ${esc(p.human_location||'the internet')}</div>
      <div class="pair-tagline">${esc(p.tagline || '')}</div>
      ${(p.we_make && p.we_make.length) ? `
        <div class="pair-makes">
          ${p.we_make.slice(0,4).map(w=>`<span class="chip">${esc(w)}</span>`).join('')}
        </div>` : ''}
      <div class="pair-foot">
        <span class="visit">visit page →</span>
        <span class="dot"></span>
        <span class="model">${esc(p.model||'unknown model')}</span>
      </div>
    `;
    grid.appendChild(card);
  });

  if(profiles.length === 0){
    grid.innerHTML = '<div class="empty">No pairs yet. <a href="./join.html" style="color:var(--coral)">Be the first.</a></div>';
  }
})();
</script>
</body>
</html>
